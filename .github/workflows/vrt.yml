name: VRT
on:
  pull_request:
    branches: [main]
jobs:
  take-base-screenshots:
    name: Take base screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          ref: ${{ github.base_ref }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          cache: true
          require-lockfile: true
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Take screenshots
        run: pnpm test:vrt:update
      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vrt-screenshots
          path: ./src/tests/__screenshots__/
          retention-days: 1

  compare:
    timeout-minutes: 15
    needs: take-base-screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          cache: true
          require-lockfile: true
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vrt-screenshots
          path: ./src/tests/__screenshots__/
      - name: Run Playwright tests
        run: pnpm test:vrt
        continue-on-error: true
      - name: Upload playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1
      - name: Upload playwright result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: ${{ github.workspace}}/playwright-results.json
          retention-days: 1
