name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          cache: true
          require-lockfile: true
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: test
        run: pnpm test
