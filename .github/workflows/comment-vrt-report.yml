name: Comment VRT Report
on:
  workflow_run:
    workflows: ["VRT"]
    types: [completed]
jobs:
  comment-vrt-report:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          cache: true
          require-lockfile: true
      - name: Download playwright results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: playwright-results
          path: ${{ github.workspace}}
          github-token: ${{ github.token }}
      - name: Comment PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VRT_REPORT_PATH: ${{ github.workspace}}/playwright-results.json
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests?.[0];
            if (!pr) {
              core.info("workflow_run に紐づく PR が見つからないためコメントをスキップします");
              return;
            }
            const runId = context.payload.workflow_run.id;
            const prNumber = pr.number;
            const script = await import('${{ github.workspace }}/scripts/vrt-comment-pr.js');
            await script.default({ github, core, context, runId, prNumber });
